<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Backend API development illustration</title>
  <desc id="desc">Fictional illustration of REST API endpoints connected to a SQL database.</desc>
  <rect width="1600" height="1000" fill="#060912"/>
  <g stroke="#22314a" stroke-width="2" opacity=".7">
    <path d="M0 140H1600M0 280H1600M0 420H1600M0 560H1600M0 700H1600M0 840H1600"/>
    <path d="M160 0V1000M320 0V1000M480 0V1000M640 0V1000M800 0V1000M960 0V1000M1120 0V1000M1280 0V1000M1440 0V1000"/>
  </g>
  <rect x="150" y="170" width="1300" height="660" rx="32" fill="#0e1220" stroke="#29415d"/>
  <rect x="210" y="230" width="470" height="540" rx="20" fill="#0b0f1e" stroke="#29415d"/>
  <text x="255" y="290" fill="#7f8ea3" font-family="monospace" font-size="28">REST API</text>
  <g font-family="monospace" font-size="26">
    <text x="255" y="370" fill="#22d3a2">●</text><text x="290" y="370" fill="#cbd5e1">POST</text><text x="390" y="370" fill="#00d4ff">/api/customers</text>
    <text x="255" y="450" fill="#22d3a2">●</text><text x="290" y="450" fill="#cbd5e1">GET </text><text x="390" y="450" fill="#00d4ff">/api/reports</text>
    <text x="255" y="530" fill="#22d3a2">●</text><text x="290" y="530" fill="#cbd5e1">POST</text><text x="390" y="530" fill="#00d4ff">/api/auth/login</text>
    <text x="255" y="610" fill="#22d3a2">●</text><text x="290" y="610" fill="#cbd5e1">GET </text><text x="390" y="610" fill="#00d4ff">/api/invoices</text>
  </g>
  <path d="M710 500H890" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M850 470L890 500L850 530" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="930" y="270" width="420" height="430" rx="22" fill="#0b0f1e" stroke="#29415d"/>
  <text x="980" y="330" fill="#7f8ea3" font-family="monospace" font-size="28">SQL / MySQL</text>
  <g fill="#192236" stroke="#38516f">
    <rect x="985" y="390" width="310" height="64" rx="12"/><rect x="985" y="480" width="310" height="64" rx="12"/><rect x="985" y="570" width="310" height="64" rx="12"/>
  </g>
  <g fill="#cbd5e1" font-family="monospace" font-size="24">
    <text x="1015" y="431">customers</text><text x="1015" y="521">orders</text><text x="1015" y="611">reports</text>
  </g>
  <circle cx="1310" cy="760" r="18" fill="#00d4ff"/><circle cx="1260" cy="760" r="18" fill="#7c3aed"/>
  <text x="150" y="900" fill="#64748b" font-family="monospace" font-size="24">FICTIONAL / PORTFOLIO ILLUSTRATION — NO CLIENT DATA</text>
</svg>